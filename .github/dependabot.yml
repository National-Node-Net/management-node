version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"

  # target-branch intentionally omitted: action updates target main (auto-merged) and are back-merged to develop.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
