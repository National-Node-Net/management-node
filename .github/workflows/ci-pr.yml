name: CI on pull request

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - 'feature/demo-branch'
env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # Fetch the full history required for accurate SonarCloud pull-request analysis.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      # Install the project JDK and restore Maven dependencies from the cache.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-password: GH_PACKAGES_PAT

      # Compile the application and run its test suite.
      - name: Build and test
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: ./mvnw $MAVEN_CLI_OPTS verify

      # Send the coverage report produced by the verified build to SonarCloud.
      - name: Publish coverage to SonarCloud
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_N3 }}
        run: ./mvnw $MAVEN_CLI_OPTS verify -Dsonar.projectKey=National-Node-Net_management-node -Dsonar.organization=national-node-net -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      # Fail early if Maven did not generate the coverage report expected by SonarCloud.
      - name: Verify JaCoCo XML exists
        run: test -f target/site/jacoco/jacoco.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fetch the source used by the formatting check.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Install the project JDK and restore Maven dependencies from the cache.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-password: GH_PACKAGES_PAT

      # Check source formatting without modifying the working tree.
      - name: Run Spotless
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: ./mvnw $MAVEN_CLI_OPTS spotless:check

  docker-build-test-scan:
    name: Docker build and vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fetch the Dockerfile and source used by the image build.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Install Java so the Maven wrapper can read the project version.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Read the Maven version used in the JAR filename.
      - name: Get project version
        id: get-version
        run: echo "project_version=$(./mvnw $MAVEN_CLI_OPTS help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      # Build the production runtime image locally for vulnerability scanning.
      - name: Build image
        run: docker build --no-cache --build-arg JAR_NAME="management-node-${{ steps.get-version.outputs.project_version }}" -t management-node:ci -f docker/Dockerfile --target management-node .

      # Report Docker's local SHA-256 image ID for comparison with other workflows.
      - name: Report image ID
        run: |
          IMAGE_ID="$(docker image inspect --format='{{.Id}}' management-node:ci)"
          echo "Image ID: $IMAGE_ID" | tee -a "$GITHUB_STEP_SUMMARY"

      # Fail the workflow when the built image contains an unfixed critical or high vulnerability.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: management-node:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          continue-on-error: true