name: automated tests and development image

on:
  push:
    branches:
      - 'develop'
      - 'main'
  pull_request:
    branches:
      - 'develop'
      - 'main'
  workflow_dispatch:

env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

jobs:
  build:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-22.04
    outputs:
      project_version: ${{ steps.image.outputs.project_version }}
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # retain history for sonar analysis and pull-request decoration.
          fetch-depth: 0

      - name: set up jdk 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-password: 'GH_PACKAGES_PAT'
      
      - name: build and test
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: ./mvnw $MAVEN_CLI_OPTS verify

      - name: code coverage
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_N3 }}
        run: ./mvnw $MAVEN_CLI_OPTS verify -Dsonar.projectKey=National-Node-Net_management-node -Dsonar.organization=national-node-net -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        
      - name: set image metadata
        id: image
        # expose values needed by the separate docker workflow.
        run: |
          version=$(./mvnw $MAVEN_CLI_OPTS help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "project_version=$version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$version-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: upload server jar
        # make the jar available to the docker job, which runs on a new runner.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: management-node-${{ steps.image.outputs.project_version }}.jar
          path: target/management-node-${{ steps.image.outputs.project_version }}.jar
          retention-days: 1

  lint:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: set up jdk 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-password: 'GH_PACKAGES_PAT'
          
      - name: lint
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: ./mvnw $MAVEN_CLI_OPTS spotless:check

  release-aws:
    name: build and release development image
    needs: build
    permissions:
      contents: read
      id-token: write
    # call the reusable workflow; it downloads the uploaded jar, then builds, scans, tags, and pushes the image.
    uses: ./.github/workflows/docker-aws.yml
    secrets: inherit
    with:
      image_tag: "${{ needs.build.outputs.image_tag }},dev-latest"
      jar_version: ${{ needs.build.outputs.project_version }}
      dry_run: false
      docker_target: management-node
