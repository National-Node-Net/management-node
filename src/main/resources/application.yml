spring:
  application:
    name: management-node
  cloud:
    vault:
      uri: http://localhost:8200
      token:  # access token to vault
      authentication: token
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://localhost:8443/realms/mng-node
          jwk-set-uri: https://localhost:8443/realms/mng-node/protocol/openid-connect/certs
          audiences: management-node
        opaquetoken:
          introspection-uri: https://localhost:8443/realms/mng-node/protocol/openid-connect/token/introspect
          client-id: management-node
          client-secret:
  flyway:
    create-schemas: on
    default-schema: mn
    locations: classpath:db/migration,classpath:db/samples # samples are only for local development
    enabled: true
    baseline-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5433/keycloak_db # this is setup to get you going easily using the Keycloak postgres so change this !
    username: ${POSTGRES_USER:keycloak_db_user}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        default_schema: mn

# Server configuration
server:
  port: 8090
  ssl:
    key-alias: localhost
    key-store: keystore.jks #path to ssl keystore
    key-store-type: PKCS12
    key-store-password: ${CERTPASSWORD:defaultpassword} #keystore password
    trust-store: truststore.jks #path to ssl truststore
    trust-store-password: ${CERTPASSWORD:defaultpassword} #truststore password
    trust-store-type: PKCS12
    client-auth: need
    enabled: true # disable for local development Only
application:
  vault:
    pki-mount: pki-int # mount point for intermediate CA
    default-role: default-role # default role for signing CSRs
    default-ttl: 24h # default TTL for signing CSRs
  bootstrap:
    ttl: ${BOOTSTRAP_CERT_TTL:2h} # TTL for bootstrap certificates
    oid: ${BOOTSTRAP_OID:1.3.6.1.4.1.32473.1.1} # OID for bootstrap cert marker (RFC 5612 example PEN)
  client:
    key-store: keystore.jks # path to MTLS client keystore
    key-store-password: ${CERTPASSWORD:} # MTLS client keystore password
    keyStoreType: JKS
  opa:
    # base URL of the OPA server (PDP). Must be https:// in any non-local environment -
    # this service enforces mTLS for all service-to-service traffic, and the client
    # keystore/truststore configured above are applied automatically to any https:// call.
    url: ${OPA_URL:http://localhost:8181}
    decision-path: ${OPA_DECISION_PATH:/v1/data/management_node/allow} # OPA decision query path
    connect-timeout: ${OPA_CONNECT_TIMEOUT:2s} # max time to establish a connection to OPA
    read-timeout: ${OPA_READ_TIMEOUT:3s} # max time to wait for an OPA decision response
    protected-paths: # API path patterns the Policy Enforcement Point intercepts
      - /api/v1/configuration/**
  product-discovery:
    # upper bound on candidates fetched per discovery request, before per-candidate PDP
    # evaluation - keeps the synchronous PDP call loop bounded
    max-candidates: ${PRODUCT_DISCOVERY_MAX_CANDIDATES:200}

# Actuator Configuration
management:
  server:
    port: 8081
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
# Logging Configuration
logging:
  level:
    org.springframework.security: DEBUG
    uk.gov.dbt.ndtp.ia.node.management: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{clientId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{clientId}] - %msg%n"