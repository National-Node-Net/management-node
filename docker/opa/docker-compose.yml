services:
  opa:
    image: openpolicyagent/opa:1.20.2
    container_name: opa
    restart: unless-stopped

    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--diagnostic-addr=0.0.0.0:8282"
      - "--log-level=${OPA_LOG_LEVEL:-info}"
      - "--log-format=json"
      - "--set=decision_logs.console=true"
      # Unit tests live beside the rules they test; they are for `opa test`, not for serving.
      - "--ignore=*_test.rego"
      # The whole tree: dispatch.rego, the rules under policies.*, and routing/data.json,
      # which loads as data.routing because data files are keyed by their directory.
      - "/policies"

    ports:
      - "${OPA_PORT:-8181}:8181"
      - "${OPA_DIAGNOSTIC_PORT:-8282}:8282"

    volumes:
      # Read-only: edit the policy tree on the host, then `docker compose restart opa`.
      - ./policies:/policies:ro

    healthcheck:
      # The image has no shell or curl, so health is probed with OPA's own binary
      # against the diagnostic listener.
      test:
        - "CMD"
        - "/opa"
        - "eval"
        - "--fail"
        - 'http.send({"method":"get","url":"http://127.0.0.1:8282/health","raise_error":false}).status_code == 200'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
